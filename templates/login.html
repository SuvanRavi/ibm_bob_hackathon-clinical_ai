<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedAssistant - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

    <div class="login-wrapper">

        <!-- Brand -->
        <div class="login-brand">
            <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
                <rect x="14" y="8" width="4" height="16" fill="#cc785c"/>
                <rect x="8" y="14" width="16" height="4" fill="#cc785c"/>
                <circle cx="16" cy="16" r="14" stroke="#cc785c" stroke-width="2" fill="none"/>
            </svg>
            <h1 class="login-brand-name">MedAssistant</h1>
        </div>

        <p class="login-tagline">Your personal clinical companion</p>

        <!-- Login Card -->
        <div class="login-card">

            <div class="login-card-header">
                <h2 class="login-card-title">Welcome back</h2>
                <p class="login-card-subtitle">Choose how you'd like to continue</p>
            </div>

            <div class="login-options">

                <!-- Doctor Login -->
                <button class="login-option-btn login-option-doctor" onclick="loginAs('doctor')">
                    <div class="login-option-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M3 21C3 17.134 7.02944 14 12 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M17 17H21M19 15V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="login-option-text">
                        <span class="login-option-title">Doctor</span>
                        <span class="login-option-desc">Manage your profile & availability</span>
                    </div>
                    <div class="login-option-arrow">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </button>

                <!-- Divider -->
                <div class="login-divider">
                    <span>or</span>
                </div>

                <!-- Patient Login -->
                <button class="login-option-btn login-option-patient" onclick="loginAs('patient')">
                    <div class="login-option-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M3 21C3 17.134 7.02944 14 12 14C16.9706 14 21 17.134 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="login-option-text">
                        <span class="login-option-title">Patient</span>
                        <span class="login-option-desc">Schedule appointments & view records</span>
                    </div>
                    <div class="login-option-arrow">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </button>

            </div>

            <p class="login-disclaimer">
                This is a proof-of-concept demonstration. No credentials required.
            </p>

        </div>

        <p class="login-footer">MedAssistant &copy; 2026 &mdash; Clinical Proof of Concept</p>

    </div>

    <script>
        function loginAs(role) {
            // Save role to localStorage
            localStorage.setItem('userRole', role);

            // Redirect based on role
            if (role === 'doctor') {
                window.location.href = '/docprofile';
            } else {
                window.location.href = '/';
            }
        }
    </script>

</body>
</html>
